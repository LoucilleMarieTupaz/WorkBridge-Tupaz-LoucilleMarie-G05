
<!DOCTYPE html>
<html>
<head>
    <title>WorkBridge - Register</title>
</head>
<body>

    <h1>Create a WorkBridge Account</h1>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Register</button>
    </form>

    <p>
        Already have an account?
        Login
    </p>

</body>
</html>
